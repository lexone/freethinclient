name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Python tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate scripts and JavaScript
        run: |
          bash -n install.sh
          node --check web/app.js
          node --check web/fleet.js
          node tests/ui-monitor.cjs
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 -m compileall -q app scripts client
      - name: Installer smoke test in a disposable systemd container
        run: |
          docker run -d --name ftc-smoke --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v "$PWD:/source:ro" ubuntu:24.04 /bin/bash -c 'apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y systemd systemd-sysv sudo && exec /sbin/init'
          for attempt in $(seq 1 60); do
            if docker exec ftc-smoke systemctl is-system-running 2>/dev/null | grep -Eq 'running|degraded'; then break; fi
            sleep 2
          done
          docker exec ftc-smoke bash /source/install.sh --server-name 127.0.0.1
          docker exec ftc-smoke bash /source/install.sh --server-name 127.0.0.1
          docker exec ftc-smoke python3 -c 'import json,urllib.request; assert json.load(urllib.request.urlopen("http://127.0.0.1:8080/healthz"))["status"] == "ok"'
          docker exec ftc-smoke systemctl is-active freethinclient freethinclient-update.timer nginx
          docker exec -e FTC_DISPOSABLE_TEST=1 ftc-smoke python3 /source/tests/smoke_update.py
      - name: Smoke test diagnostics
        if: failure()
        run: docker exec ftc-smoke journalctl --no-pager -n 100 || true
      - name: Clean smoke container
        if: always()
        run: docker rm -f ftc-smoke || true
  client-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Exercise Ubuntu host and Debian 12 live-build configuration
        run: |
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -keyout /tmp/ftc-test.key -out /tmp/ftc-test.crt -subj /CN=127.0.0.1 -addext subjectAltName=IP:127.0.0.1
          sudo env FTC_BUILD_CONFIG_ONLY=1 bash scripts/build-client.sh https://127.0.0.1:8443 /tmp/ftc-test.crt /var/tmp/ftc-client-config
          test -f /var/tmp/ftc-client-config/builder-root/work/config/binary
          test -f /var/tmp/ftc-client-config/builder-root/work/config/hooks/live/0900-freethinclient.hook.chroot
