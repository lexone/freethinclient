name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Python tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate scripts and JavaScript
        run: |
          bash -n install.sh
          node --check web/app.js
          node --check web/fleet.js
          node --check web/images.js
          node --check web/shortcuts.js
          node --check web/network.js
          node tests/ui-monitor.cjs
          node tests/ui-network.cjs
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 -m compileall -q app scripts client
      - name: Device information widget on a disposable display
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 xvfb xauth
          timeout 15s xvfb-run -a python3 tests/smoke_device_info.py
          timeout 15s xvfb-run -a python3 tests/smoke_network.py
      - name: Real Xfce desktop and panel on a disposable display
        run: |
          sudo apt-get install -y xfdesktop4 xfce4-panel xfwm4 xfconf dbus-x11 libglib2.0-bin gvfs xdg-user-dirs librsvg2-bin
          desktop_test_home=$(mktemp -d /tmp/ftc-xfce-test-XXXXXXXX)
          HOME="$desktop_test_home" timeout 90s dbus-run-session -- xvfb-run -a python3 tests/smoke_desktop_session.py
      - name: Refresh a disposable PXE image
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools librsvg2-bin
          sudo bash tests/smoke_client_refresh.sh
          sudo python3 tests/smoke_image_portal.py
      - name: Installer smoke test in a disposable systemd container
        run: |
          docker run -d --name ftc-smoke --privileged --cgroupns=host -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v "$PWD:/source:ro" ubuntu:24.04 /bin/bash -c 'apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y systemd systemd-sysv sudo && exec /sbin/init'
          for attempt in $(seq 1 60); do
            if docker exec ftc-smoke systemctl is-system-running 2>/dev/null | grep -Eq 'running|degraded'; then break; fi
            sleep 2
          done
          docker exec ftc-smoke bash /source/install.sh --server-name 127.0.0.1
          docker exec ftc-smoke cmp /source/deploy/release-public.pem /etc/freethinclient/release-public.pem
          docker exec ftc-smoke test ! -e /root/freethinclient-signing/release-private.pem
          docker exec ftc-smoke bash /source/install.sh --server-name 127.0.0.1
          docker exec ftc-smoke python3 -c 'import json,urllib.request; assert json.load(urllib.request.urlopen("http://127.0.0.1:8080/healthz"))["status"] == "ok"'
          docker exec ftc-smoke systemctl is-active freethinclient freethinclient-update.timer freethinclient-image.timer nginx
          docker exec ftc-smoke python3 /source/tests/smoke_image_portal.py --service
          docker exec ftc-smoke apt-get install -y network-manager
          docker exec ftc-smoke python3 /source/tests/smoke_dns.py
          docker exec -e FTC_DISPOSABLE_TEST=1 ftc-smoke python3 /source/tests/smoke_update.py
      - name: Smoke test diagnostics
        if: failure()
        run: docker exec ftc-smoke journalctl --no-pager -n 100 || true
      - name: Clean smoke container
        if: always()
        run: docker rm -f ftc-smoke || true
  client-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Exercise Ubuntu host and Debian 12 live-build configuration
        run: |
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -keyout /tmp/ftc-test.key -out /tmp/ftc-test.crt -subj /CN=127.0.0.1 -addext subjectAltName=IP:127.0.0.1
          sudo env FTC_BUILD_CONFIG_ONLY=1 bash scripts/build-client.sh https://127.0.0.1:8443 /tmp/ftc-test.crt /var/tmp/ftc-client-config
          test -f /var/tmp/ftc-client-config/builder-root/work/config/binary
          test -f /var/tmp/ftc-client-config/builder-root/work/config/hooks/live/0900-freethinclient.hook.chroot
          test -x /var/tmp/ftc-client-config/builder-root/work/config/includes.chroot/etc/initramfs-tools/hooks/freethinclient-banner
          test -f /var/tmp/ftc-client-config/builder-root/work/config/includes.chroot/usr/share/freethinclient/boot-banner.txt
